<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>駅を追加する</title>
</head>
<body>
  <h2>京葉線の駅を追加する</h2>
  <form action="/keiyo2_add">
    <p><label for="id">ID</label>
      <input type="number" name="id" id="id" min="1" required></p>
    <p><label for="code">駅コード</label>
      <input type="text" name="code" id="code" required></p>
    <p><label for="name">駅名</label>
      <input type="text" name="name" id="name" required></p>
    <p><label for="change">乗り換え線</label>
      <input type="text" name="change" id="change"></p>
    <p><label for="passengers">乗降客数</label>
      <input type="number" name="passengers" id="passengers" min="0" required></p>
    <p><label for="distance">東京駅からの距離</label>
      <input type="number" name="distance" id="distance" min="0" step="any" required> km</p>
    <input type="submit" value="登録">
  </form>
  <p><a href="/keiyo2">駅一覧に戻る</a></p>
</body>
</html>
