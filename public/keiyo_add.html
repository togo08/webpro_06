<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>駅を追加する</title>
</head>
<body>
  <h2>駅を追加する</h2>
  <form action="/keiyo_add">
    <label for="id">ID</label>
    <input type="number" name="id" id="id" required>
    <label for="code">駅コード</label>
    <input type="text" name="code" id="code" required>
    <label for="name">駅名</label>
    <input type="text" name="name" id="name" required>
    <input type="submit" value="登録">
  </form>
  <p><a href="/keiyo">駅一覧を見る</a></p>
</body>
</html>
